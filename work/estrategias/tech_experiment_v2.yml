qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_data"
    region: us

# Universos: usar nasdaq100 completo para entrenar/aprender
market: &market nasdaq100
benchmark: &benchmark ^NDX

data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2026-08-12
    fit_start_time: 2008-01-01
    fit_end_time: 2026-08-12
    instruments: *market
    infer_processors:
        - class: FilterCol
          kwargs: { fields_group: feature, col_list: ["RESI5", "WVMA5", "RSQR5", "KLEN", "ROC60", "VSTD5", "STD5"] }
        - class: RobustZScoreNorm
          kwargs: { fields_group: feature, clip_outlier: true }
        - class: Fillna
          kwargs: { fields_group: feature }
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs: { fields_group: label }
    # Label con horizonte más largo (retorno a 10 días) para reducir ruido
    label: ["Ref($close, -11) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            # Topk mayor: compra las 10 mejores puntuadas (memoria ~$100k / 10 = $10k por posición)
            topk: 10
            n_drop: 0
            only_tradable: true
    backtest:
        start_time: 2022-01-01
        end_time: 2026-08-11  # margen: no usar el último día del calendario
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.03
            num_leaves: 64
            max_depth: 6
            num_threads: 20
            # regularización más fuerte para evitar overfitting
            lambda_l1: 1.0
            lambda_l2: 5.0
            colsample_bytree: 0.7
            subsample: 0.8
            n_estimators: 500
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2021-12-31]
                valid: [2022-01-01, 2023-12-31]
                test: [2024-01-01, null]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
