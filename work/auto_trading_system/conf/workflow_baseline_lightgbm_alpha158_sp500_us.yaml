# ===========================================================================
# SP500 US Baseline — LightGBM + Alpha158
#
# TAREA #6 del ROADMAP TRABAJO (prioridad pendiente desde agosto 2026).
# Basado en la plantilla oficial examples/benchmarks/LightGBM/Alpha158.
#
# EJECUTAR (desde WSL, con qlib instalado):
#     cd /mnt/c/Users/trodriguez/src/qlib
#     conda run -n qlib qrun work/auto_trading_system/conf/workflow_baseline_lightgbm_alpha158_sp500_us.yaml
#
# ADAPTACIONES respecto a la plantilla china (verificadas 2026-10-26):
#   - provider_uri : ~/.qlib/qlib_data/us_data  (confirmado: 1.3 GB, 18.575 tickers)
#   - region       : us
#   - market       : sp500  (NO existe sp500_liquid.txt en esta instalacion;
#                    sp500.txt tiene 1.180 tickers con composicion historica,
#                    lo que EVITA el sesgo de supervivencia)
#   - benchmark    : ^GSPC  (confirmado presente en features/)
#   - limit_threshold: 0.095 -> se mantiene (circuit breaker chino).
#                    En US NO hay limite diario del 10%, pero qlib lo usa para
#                    excluir dias con saltos anomalos. Ver nota al final.
#
# SEGMENTOS TEMPORALES
#   El calendario disponible va de 1999-12-31 a 2026-10-23.
#   Se reparten 2008-2026 para tener validacion y test con crisis reales
#   (2008 financiera, 2020 COVID, 2022 inflacion).
# ===========================================================================

qlib_init:
    provider_uri: "~/.qlib/qlib_data/us_data"
    region: us

market: &market sp500
benchmark: &benchmark ^GSPC

# NOTA sobre end_time (corregido 2026-10-26):
#   El calendario del dataset termina en 2026-10-23 (6744 fechas). qlib hace
#   _calendar[calendar_index + 1] para cerrar el ultimo intervalo de trading,
#   asi que si end_time == ULTIMA fecha del calendario, se sale del array:
#       IndexError: index 6744 out of bounds for axis 0 with size 6744
#   Se deja ~1 semana de margen respecto al fin del calendario.
#   Si se actualizan los datos, mover esta fecha (y las de test) en consecuencia.
END_DATE: &end_date "2026-10-16"

data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: *end_date
    fit_start_time: 2008-01-01
    fit_end_time: 2018-12-31
    instruments: *market
    infer_processors:
        - class: RobustZScoreNorm
          kwargs: { fields_group: feature, clip_outlier: true }
        - class: Fillna
          kwargs: { fields_group: feature }
    learn_processors:
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: label
    label: ["Ref($close, -2) / Ref($close, -1) - 1"]

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 3
    backtest:
        start_time: 2022-01-01
        end_time: *end_date
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.0421
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
            early_stopping_rounds: 50
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2008-01-01, 2018-12-31]
                valid: [2019-01-01, 2021-12-31]
                test:
                    - 2022-01-01
                    - *end_date
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
